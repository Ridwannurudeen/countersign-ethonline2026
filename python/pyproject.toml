[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "x402-hedera-client-preview"
version = "0.1.0"
description = "Preview of a Python x402 exact-payment client for Hedera"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "hiero-sdk-python==0.2.10",
  "x402==2.22.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["x402.mechanisms.hedera*"]
namespaces = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
